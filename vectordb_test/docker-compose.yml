# 다른 머신/서버용. 이 개발 머신에서는 쓸 수 없다 — docker 가 설치돼 있지 않다.
# (이번 검증은 시스템에 직접 설치된 PostgreSQL 18.6 + pgvector 0.8.1 로 진행했다.)
#
#   docker compose up -d
#   psql -h 127.0.0.1 -p 5432 -U postgres -d vectordb_test -f schema.sql
services:
  db:
    # pgvector 가 미리 빌드된 공식 이미지. 확장을 따로 컴파일할 필요가 없다.
    image: pgvector/pgvector:pg18
    container_name: vectordb_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vectordb_test
      # 한국어 데이터라 UTF8 고정. locale 은 C 로 둔다 —
      # 어차피 한국어 형태소 분석기가 없어 collation 이 검색 품질에 관여하지 않는다.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vectordb_test"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
