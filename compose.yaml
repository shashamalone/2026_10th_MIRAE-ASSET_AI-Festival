name: financial-product-platform-v2

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_agent}
      POSTGRES_USER: ${POSTGRES_USER:-agent_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data-pg17:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_admin} -d ${POSTGRES_DB:-financial_agent}"]
      interval: 5s
      timeout: 5s
      retries: 12

  graph:
    image: ghcr.io/oxigraph/oxigraph:latest
    command: ["serve-read-only", "--location", "/data", "--bind", "0.0.0.0:7878"]
    volumes:
      - oxigraph-data:/data
      - ./ontology:/tbox:ro
      - ./artifacts/graph_v2:/abox:ro
    ports:
      - "${GRAPH_BIND:-127.0.0.1}:${GRAPH_PORT:-7878}:7878"
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL for the read-only role must be set}
      OXIGRAPH_URL: http://graph:7878
      CLOVA_API_KEY: ${CLOVA_API_KEY:-}
      CLOVA_HOST: ${CLOVA_HOST:-https://clovastudio.stream.ntruss.com}
      API_MAX_ROWS: ${API_MAX_ROWS:-100}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-2000}
    depends_on:
      db:
        condition: service_healthy
      graph:
        condition: service_started
    ports:
      - "${API_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  builder:
    build: .
    profiles: ["ops"]
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: ${ADMIN_DATABASE_URL:?ADMIN_DATABASE_URL must be set for builder}
      DATASET_DIR: /data/source
      LEGACY_DATA_DIR: /data/legacy
      CLOVA_API_KEY: ${CLOVA_API_KEY:-}
      CLOVA_HOST: ${CLOVA_HOST:-https://clovastudio.stream.ntruss.com}
      DART_API_KEY: ${DART_API_KEY:-}
      LSEG_APP_KEY: ${LSEG_APP_KEY:-}
      LSEG_CLIENT_ID: ${LSEG_CLIENT_ID:-}
      LSEG_CLIENT_SECRET: ${LSEG_CLIENT_SECRET:-}
    volumes:
      - "${DATASET_DIR:?DATASET_DIR must point to the canonical 2026-08-24 XLSX directory}:/data/source:ro"
      - "${LEGACY_DATA_DIR:-../data/data}:/data/legacy:ro"
      - ./artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "kb.build_data_platform_v2"]

volumes:
  postgres-data-pg17:
  oxigraph-data:
